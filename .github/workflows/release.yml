name: Build and publish release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release tag and signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^versionName=//p' version.properties)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::versionName is missing from version.properties"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Run a public release from the default branch ($DEFAULT_BRANCH)"
              exit 1
            fi
            RELEASE_TAG="v${VERSION_NAME}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
            if [[ "$RELEASE_TAG" != "v${VERSION_NAME}" ]]; then
              echo "::error::Release tag must match version.properties (v${VERSION_NAME}); got ${RELEASE_TAG}"
              exit 1
            fi
          fi
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::${RELEASE_TAG} already points to a different commit"
              exit 1
            fi
          fi
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret is missing: $name"
              exit 1
            fi
          done
          RELEASE_NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          python3 - "$VERSION_NAME" "$RELEASE_NOTES_PATH" <<'PY'
          from pathlib import Path
          import re
          import sys

          version_name, output_path = sys.argv[1:]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          header = re.compile(rf"^##\s+v{re.escape(version_name)}(?:\s|$)")
          start = next((index for index, line in enumerate(lines) if header.match(line)), None)
          if start is None:
              raise SystemExit(f"No CHANGELOG.md section found for v{version_name}")
          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md section for v{version_name} is empty")
          Path(output_path).write_text(notes + "\n", encoding="utf-8")
          PY
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=$RELEASE_NOTES_PATH" >> "$GITHUB_ENV"
      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -qo /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          set +o pipefail
          yes 2>/dev/null | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar" >> "$GITHUB_ENV"
      - name: Run host regression suites
        run: |
          python run_tests.py "$RUNNER_TEMP/test-pure"
          python tests/run_lifecycle.py "$RUNNER_TEMP/test-lifecycle"
          python tests/provider_check.py "$RUNNER_TEMP/test-provider"
          python tests/settings_check.py "$RUNNER_TEMP/test-settings"
          python tests/widgets_check.py "$RUNNER_TEMP/test-widgets"
          python tests/supported_apps_check.py "$RUNNER_TEMP/test-supported"
      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/ltpo-x-cos-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OUT: ${{ runner.temp }}/ltpo-x-cos-release-build
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
        run: |
          APK_NAME="LTPO-X-COS-${RELEASE_TAG}.apk" bash build.sh
      - name: Publish APK asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          APK="$RUNNER_TEMP/ltpo-x-cos-release-build/LTPO-X-COS-${TAG}.apk"
          RELEASE_INFO_PATH="$RUNNER_TEMP/release-info.json"
          RELEASE_ERROR_PATH="$RUNNER_TEMP/release-info-error.txt"
          if gh release view "$TAG" --json databaseId,isDraft > "$RELEASE_INFO_PATH" 2> "$RELEASE_ERROR_PATH"; then
            RELEASE_INFO="$(cat "$RELEASE_INFO_PATH")"
            RELEASE_ID="$(jq -r '.databaseId' <<< "$RELEASE_INFO")"
            IS_DRAFT="$(jq -r '.isDraft' <<< "$RELEASE_INFO")"
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "LTPO-X (COS) ${TAG}" \
              --notes-file "$RELEASE_NOTES_PATH"
            if [[ "$IS_DRAFT" == "true" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
            fi
          else
            STATUS=$?
            if ! grep -Eiq 'release not found|HTTP 404|404 Not Found' "$RELEASE_ERROR_PATH"; then
              cat "$RELEASE_ERROR_PATH" >&2
              exit "$STATUS"
            fi
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "LTPO-X (COS) ${TAG}" --notes-file "$RELEASE_NOTES_PATH"
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ltpo-x-cos-release.jks"
