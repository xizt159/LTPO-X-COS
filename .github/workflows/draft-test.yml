name: Build draft test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -qo /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          set +o pipefail
          yes 2>/dev/null | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar" >> "$GITHUB_ENV"
      - name: Run host regression suites
        run: |
          python run_tests.py "$RUNNER_TEMP/test-pure"
          python tests/run_lifecycle.py "$RUNNER_TEMP/test-lifecycle"
          python tests/provider_check.py "$RUNNER_TEMP/test-provider"
          python tests/settings_check.py "$RUNNER_TEMP/test-settings"
          python tests/widgets_check.py "$RUNNER_TEMP/test-widgets"
          python tests/supported_apps_check.py "$RUNNER_TEMP/test-supported"
      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret is missing: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/ltpo-x-cos-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
      - name: Build signed test APK
        env:
          KEYSTORE: ${{ runner.temp }}/ltpo-x-cos-release.jks
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OUT: ${{ runner.temp }}/ltpo-x-cos-draft-build
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
        run: |
          VERSION_NAME="$(sed -n 's/^versionName=//p' version.properties)"
          APK_NAME="LTPO-X-COS-v${VERSION_NAME}-test.apk" bash build.sh
      - name: Upload APK to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^versionName=//p' version.properties)"
          TAG="v${VERSION_NAME}"
          APK="$RUNNER_TEMP/ltpo-x-cos-draft-build/LTPO-X-COS-${TAG}-test.apk"
          EXISTING="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$EXISTING" == "true" ]]; then
            gh release upload "$TAG" "$APK" --clobber
          elif [[ "$EXISTING" == "false" ]]; then
            echo "::error::${TAG} already has a public release; refusing to replace it"
            exit 1
          else
            gh release create "$TAG" "$APK" --draft --target "$GITHUB_SHA" \
              --title "LTPO-X (COS) ${TAG} — Test draft" \
              --notes "Unpublished test build. Download to test before publishing this release."
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ltpo-x-cos-release.jks"
