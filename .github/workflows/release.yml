name: Build and publish release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example, v1.0.0-beta.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release tag and signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^versionName=//p' version.properties)"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* || -z "$VERSION_NAME" || "$TAG_VERSION" != "$VERSION_NAME" ]]; then
            echo "::error::Release tag must be v${VERSION_NAME}; got ${RELEASE_TAG}"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "::error::Release tag does not exist: ${RELEASE_TAG}"
            exit 1
          fi
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret is missing: $name"
              exit 1
            fi
          done
      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -qo /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          set +o pipefail
          yes 2>/dev/null | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar" >> "$GITHUB_ENV"
      - name: Run host regression suites
        run: |
          python run_tests.py "$RUNNER_TEMP/test-pure"
          python tests/run_lifecycle.py "$RUNNER_TEMP/test-lifecycle"
          python tests/provider_check.py "$RUNNER_TEMP/test-provider"
          python tests/settings_check.py "$RUNNER_TEMP/test-settings"
          python tests/widgets_check.py "$RUNNER_TEMP/test-widgets"
          python tests/supported_apps_check.py "$RUNNER_TEMP/test-supported"
      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/ltpo-x-cos-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OUT: ${{ runner.temp }}/ltpo-x-cos-release-build
          APK_NAME: LTPO-X-COS-${{ inputs.release_tag || github.ref_name }}.apk
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
        run: bash build.sh
      - name: Publish APK asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          APK="$RUNNER_TEMP/ltpo-x-cos-release-build/LTPO-X-COS-${TAG}.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "LTPO-X (COS) ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" "$APK" --clobber
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ltpo-x-cos-release.jks"
