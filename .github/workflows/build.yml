name: Verify and build test APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -qo /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-34/android.jar" >> "$GITHUB_ENV"
      - name: Run host regression suites
        run: |
          python run_tests.py "$RUNNER_TEMP/test-pure"
          python tests/run_lifecycle.py "$RUNNER_TEMP/test-lifecycle"
          python tests/provider_check.py "$RUNNER_TEMP/test-provider"
          python tests/settings_check.py "$RUNNER_TEMP/test-settings"
          python tests/widgets_check.py "$RUNNER_TEMP/test-widgets"
          python tests/supported_apps_check.py "$RUNNER_TEMP/test-supported"
      - name: Build with an ephemeral test key
        env:
          KEYSTORE: ${{ runner.temp }}/screen-tuner-test.jks
          OUT: ${{ runner.temp }}/screen-tuner-build
          APK_NAME: ScreenTuner-CI-test.apk
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTuner-CI-test-only
          path: ${{ runner.temp }}/screen-tuner-build/ScreenTuner-CI-test.apk
